# Optional drop-in for sparkpass-model.service: the boot model is GLM-5.3-Flash with the TensorFold recipe 1104
# (README, "The boot model: TensorFold 1104"). Install it as
# /etc/systemd/system/sparkpass-model.service.d/tf1104.conf, with @HOME@ replaced by the home of the user of
# sparkrun. While it exists, the unit does not use RECIPE= of /etc/sparkpass/model.env. install.sh rewrites only
# the unit file, so the drop-in stays. Back to the sparkrun recipe: delete the file, then systemctl daemon-reload.
[Service]
# After the sparkrun stop of the unit: the ranks of an earlier start, on both units.
ExecStartPre=-@HOME@/GLM-5.3-Flash-DGX-Sparks-1104/stop.sh
ExecStart=
# Returns when the API answers and the smoke test passes; its memory guard stays in this unit.
ExecStart=@HOME@/GLM-5.3-Flash-DGX-Sparks-1104/start.sh
# start.sh waits up to 2400 s for the API, and a refused context window starts the pair once more.
TimeoutStartSec=3000
