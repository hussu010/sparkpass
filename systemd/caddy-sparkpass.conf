# Drop-in for caddy.service of the Debian/Ubuntu caddy package or the official Caddy apt repository
# (both install the binary at /usr/bin/caddy; install.sh refuses another path).
# install.sh copies it to /etc/systemd/system/caddy.service.d/sparkpass.conf.
# caddy.service is disabled at boot: only `sparkpass reconcile` starts it.
[Service]
# SPARKPASS_SITE and SPARKPASS_MODEL_PORT for the placeholders of /etc/caddy/Caddyfile. No "-" prefix:
# with the file missing, Caddy does not start (fail closed).
EnvironmentFile=/etc/sparkpass/caddy.env
# Always the Caddyfile, never --resume: --resume loads the last autosaved config, not the Caddyfile
# (TODOS.md, completed item "Fail closed when the gateway does not enforce the token file", rule 2).
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/Caddyfile
# --force (as upstream): load also when the adapted config is unchanged; the reload client reads the
# token file at each reload, and the admin address (the unix socket below) from the Caddyfile.
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
# /run/caddy for the admin socket of the Caddyfile (no TCP admin API: it has no authentication). systemd
# makes the directory for the caddy user at each start and removes it at the stop, so no old socket
# stays. Without it, Caddy does not start (fail closed).
RuntimeDirectory=caddy
# The Caddyfile sets grace_period 2s. A stop then ends in about 2 s, so `systemctl try-restart caddy`
# of revoke ends within the 10 s limit of each sparkpass command. install.sh checks the result.
TimeoutStopSec=5s
