# sparkpass: the pinned model of the pair (docs/designs/guest-pass-mvp.md, "The model and the template").
# Start on the head unit (spark-3): sparkrun run templates/pair.yaml --cluster pair --no-follow
# Source: github.com/ursuciprian/qwen3.8-flash-next-dgx-spark-tp-2 @ 9e540f5f (recipes/qwen3.8-flash-next/
# qwen3.8-flash-next-2x-dgx-spark.yaml, release v2.1.0), sparkrun 0.3.10. Weights: Qwen Community License 1.0;
# its clause 2 ("Model as a Service") needs a separate license from Qwen before a paid pass.
# Changes to the source, nothing else:
#   - host 127.0.0.1: the API port binds to loopback only, where Caddy forwards; the source binds 0.0.0.0.
#   - no --enable-prompt-tokens-details: with it, usage.prompt_tokens_details.cached_tokens tells the next guest
#     exactly which prompt prefix the last guest sent (source README, "Multi-user setups").
# Limits: max_num_seqs 16 and max_model_len 262144 (the source values) passed the milestone-1 load test on
#   2026-10-15: 16 requests of 261,450-262,033 prompt tokens at the same time, all 16 done in 34.7 min (about
#   2,010 prompt tokens/s), up to 7 running, KV cache at most 29.3 %, 0 preemptions, 0 earlyoom kills; lowest
#   MemAvailable 11.7 GiB on the head and 15.3 GiB on the worker. A full-context request can wait about 35 min
#   behind 15 others. Start: 6 min 54 s the first time, 4 min 25 s after that. One stream: 62-73 tokens/s.
# Image: the tag below stays a tag (see the source comment above `container:`); on 2026-10-14 it resolved to
#   ghcr.io/ursuciprian/spark-vllm-b12x@sha256:1346035488a5c8a0f405ade8e74febf68c66b8df1e026b7e3a6fb83cb9f4ce13
#   (arm64, 34.1 GB). Check it after a pull: docker inspect --format '{{.RepoDigests}}' <tag>.

recipe_version: "1"
name: qwen3.8-flash-next-2x-dgx-spark
description: "Recommended. Qwen3.8-Flash-Next on two DGX Sparks, OpenAI-compatible API on port 8000 (2026-10-13 build, v2.1.0: GDN-MSE checkpoint with MTP drafter D3, NVFP4 GDN decode / MXFP8 prefill)."

model: ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE
# Pinned twice on purpose: model_revision drives sparkrun's download and cache
# key, and --revision in `command` makes each rank serve exactly that revision
# (docs/ENGINEERING.md of the source, known issues). The MXFP8 prefill weights come from
# local-inference-lab/Qwen3.8-Flash-Next-NVFP4 @ 7c4f1bc1 (shard 35), pinned by
# full path in VLLM_B12X_NVFP4_MXFP8_CHECKPOINT and fetched by `command`.
model_revision: 03f4a0570496bbe741189f4a2a7d611679e85406
# Kept as a tag on purpose: sparkrun 0.3.6 copies the image
# head->worker with `docker save | docker load`, which drops RepoDigests, so a
# repo@sha256 reference never matches on the worker (containers/distribute.py
# identity check). Every run would re-transfer the image and then pull it again
# from ghcr on the worker.
# v2.1.0 image of the source (2026-10-13, k94); the header above has its digest.
container: ghcr.io/ursuciprian/spark-vllm-b12x:k94-20261013-21e0b201-d21d7ade-warm
runtime: vllm

# Empty on purpose. Any token here (including --exp-b12x) makes sparkrun's
# eugr builder either substitute its own pullable nightly or try to build via
# build-and-copy.sh (sparkrun/builders/eugr.py: _wants_build()/_wants_b12x()) --
# both wrong for a tag build.sh already built and loaded on every cluster host.
# With build_args empty and a non-sentinel tag already present on all hosts,
# sparkrun's pull-first-default branch just uses it verbatim.
build_args: []

cluster_only: true
min_nodes: 2
max_nodes: 2

# Caches: sparkrun mounts ~/.cache/sparkrun/runtime-cache/vllm/<model>-<hash>
# at /cache/runtime and sets XDG_CACHE_HOME there (core/runtime_cache.py).
# b12x, triton, inductor, flashinfer and vLLM's compile cache all persist in
# it, so the recipe needs no volumes (and sparkrun ignores `volumes` from an
# untrusted registry recipe anyway). The first line of `command` seeds the
# b12x plan-selection cache from the image; see docker/b0-warm/Dockerfile. The
# second seeds the torch AOT compile cache from the image. The third fetches
# shard 35 of 7c4f1bc1 (the MXFP8 prefill weights, v2.0.0 header) when the HF
# cache lacks it and fails the boot if it cannot.

defaults:
  port: 8000
  host: 127.0.0.1
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.80

env:
  # M-dispatch (v2.0.0, k73): GDN in_proj_qkvz / out_proj calls below 41 rows (decode) run the
  # checkpoint's NVFP4 weights, calls of 41+ rows (prefill) the MXFP8 weights of 7c4f1bc1.
  VLLM_B12X_NVFP4_MXFP8_MIN_TOKENS: "41"
  VLLM_B12X_NVFP4_MXFP8_CHECKPOINT: "/cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd"
  # HC (hyper-connection) mixers online MXFP8, router gate stays BF16 (promoted
  # 2026-09-27, vLLM feat/hc-mxfp8-on-b1.1 a9aa81b23). See the comment block above
  # container: for the A/B numbers.
  VLLM_QWEN38_HC_MXFP8: "hc"
  # GDN uniform-decode metadata skip (promoted 2026-09-29, vLLM feat/r5-b13): 35 of the
  # 36 GDN KV-cache groups re-staged the b12x mixed-batch worklists, state indices and
  # prefill live counts every step (~350 eager launches) that a uniform spec-decode
  # step never reads. See the comment block above container: for the A/B numbers.
  VLLM_GDN_UNIFORM_DECODE_META_SKIP: "1"
  B12X_AUTOTUNE: "1"
  B12X_ROCE_SPIN_LIMIT: "300000000"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  # verify-head lm_head (124160x2560 BF16) ran on cuBLAS every decode step
  # because b12x's BF16 vocab projection only has a kernel for M=1: 636 MB
  # read per step, 3.6 ms = 6.5% of the 55 ms c1 step. Online MXFP8 (W8A16,
  # Mxfp8OnlineLinearMethod(use_a16=True), activations stay BF16) halves the
  # bytes read. Measured 2026-09-21 (arm la-lmq, 6 sweeps each, same boot
  # night) on the bench_sweep counting diagnostic (list 1-300, temp 0,
  # thinking off, 320 tokens, fresh context, aggregate tok/s; a spec-decode
  # ceiling, not coding speed): c1 median 99.5 / max 101.8 tok/s vs baseline
  # 95.6 / 99.5, c8 440.7 vs 433.0, gate sweep c1 100.6 / c4 293.7 / c8 454.7 /
  # c16 645.1; hardmode
  # 89/100 (la band 86-93), fidelity 8k-128k 20/20 x4, straggler c5-16 clean
  # at 3.98-3.99 accepted/draft. MTP draft head is already NVFP4
  # (VLLM_MTP_NVFP4_LM_HEAD default 1) -- both heads are now quantized.
  VLLM_MXFP8_LM_HEAD: "1"
  # Caps b12x kernel compile parallelism (~1.2 GB host RAM per worker) so a
  # cold compile cache cannot push unified memory into earlyoom. The warm
  # schema-5 selections mean no autotune; this only affects the first boot.
  B12X_COMPILE_WORKERS: "2"
  # Deferred GDN checkpoints (promoted 2026-09-25): b12x GDN decode writes one
  # base checkpoint + per-token records and replays the accepted prefix
  # instead of checkpointing every draft position. A/B vs b0, 2 boots each
  # (results/oldb12x-ab-20260925*): coding c8 +11.9%, c16 +10.3%; 16k c2
  # +12.8%, c16 +6.0%; counting c10 +13.0%, c16 +12.0%; c1 within noise;
  # hardmode 89/89, fidelity 20/20 at every depth, no stragglers.
  VLLM_GDN_DEFERRED_CHECKPOINTS: "1"
  # Prefix-drop exact (promoted 2026-09-26): with MTP the aligned prefix-cache hit
  # stopped one 2864-token block short (16k hit 11456 -> 14320, 64k 60144 -> 63008
  # with the flag). A/B vs b1, 2 boots each (results/b1.1-20260926): cached-prefix
  # TTFT -37% at 16k, -34% at 64k; coding task at 16k depth c4 +7.7%, c8 +16.7%,
  # c16 +26.6%; fresh-context coding and counting within noise; hardmode 91/89,
  # fidelity 20/20 at every depth (128k seeds 7/11/13), TC-45 5/5, no stragglers.
  VLLM_PREFIX_DROP_EXACT: "1"
  # MTP draft vocab (promoted 2026-10-01, r7 dvocab v2): the draft head scores 131,072 of
  # the 248,320 vocab ids (65,536 rows per rank) instead of all of them. Lossless: the
  # draft proposes q=0 outside the list and rejection sampling keeps the target
  # distribution. The list is ranked on our own corpora and eval outputs and always holds
  # every added/special token, all 256 byte symbols and all 8,883 single-character tokens
  # (scripts/build_draft_vocab_v2.py; held-out coverage 0.9997 on DevOps outputs). Its
  # tail order comes from the 65,536-id list of dime-online/qwen3.8-Flash-DGX-UltraFast
  # (Apache-2.0). Baked into the image by docker/b0-warm (sha256 checked at build). The
  # compile cache keys on this path, not on the file content: a changed list needs a new
  # file name.
  VLLM_MTP_DRAFT_VOCAB: "/opt/mtp-vocab/ids-v2-K131072.txt.gz"

# --speculative-config: promoted 2026-09-22 (was use_local_argmax_reduction:
# true, one-hot drafts). Clients that send no temperature run at the
# checkpoint default (1.0/0.95/20), where one-hot drafts only got 0.27
# accepted per draft token -- the draft always proposes its argmax, so the
# rejection test against a temperature-1 target distribution throws most of
# it away. Probabilistic drafts sample from the full draft distribution, so
# the rejection test stays distribution-preserving by construction. vLLM
# refuses use_local_argmax_reduction combined with draft_sample_method=
# probabilistic (ValueError), so this drops that flag. Measured 2026-09-22,
# aggregate gen tok/s, argmax -> probabilistic, default temp 1.0:
#   agent coding task (llama-benchy fork --prompt-mode task, 2048 new prompt
#   tokens, <=512 out, thinking on, prefix caching; results/benchy/la-task16.md
#   vs la-mtpprob-task16.md): c1 46.1 -> 45.6 (tie), c16 186.3 -> 221.9,
#   64k-cached c1 42.4 -> 58.4, 16k-cached c16 120.3 -> 115.4 (+-24.3)
#   prose continuation (llama-benchy 0.4.0 book, 2048 in, 128 out;
#   la-prose16.md vs la-mtpprob-prose16.md): c1 41.1 -> 56.1, c16 117.8 ->
#   126.7, 64k-cached c16 38.15 -> 36.78 (regression)
#   bench_sweep counting diagnostic (temp 0, thinking off; results/arms/
#   la-mtpprob/ on dgx-01): unchanged, c1 100.9-102.1, c8 434.6-439.4,
#   c16 635.0-641.3
# Quality gate: fidelity 8k-64k 20/20, 128k 19/20 then 20/20 x2, straggler
# c5-16 clean, hardmode 86 -> 90 on rerun (la band 86-93).
# --default-chat-template-kwargs (promoted 2026-10-01): the chat template's own default is
# reasoning_effort xhigh, which on validator-gated DevOps prompts thinks until the token
# budget runs out (b1.2: 23/42 runs never closed </think>). medium (no effort sentence
# in the system prompt) on the b1.4 candidate, DevOps 14 tasks x 3: mean checks 95.9% vs
# 42.5%, clean 29/42 vs 17/42, runaway 0/42 vs 23/42, median 33 s vs 246 s per task
# (Jev medium_default 1.00). A request still picks its own effort: top-level
# "reasoning_effort" or chat_template_kwargs {"reasoning_effort": "xhigh"|"medium"|"low"}
# (the template rejects any other value); the source README, "Thinking effort".
command: |
  S=/opt/b12x-seed/preparation; D="$XDG_CACHE_HOME/b12x/compile/preparation"; if [ -d "$S" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$D" && for f in "$S"/*.json; do [ -e "$D/$(basename "$f")" ] || cp "$f" "$D/"; done; fi
  A=/opt/b12x-seed/torch_compile_cache; if [ -d "$A" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$XDG_CACHE_HOME/vllm/torch_compile_cache" && cp -rn "$A/." "$XDG_CACHE_HOME/vllm/torch_compile_cache/" || true; fi
  M=/cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd; [ -s $M/model-00035-of-00036.safetensors ] && [ -s $M/model.safetensors.index.json ] || HF_HUB_OFFLINE=0 python3 -c "from huggingface_hub import snapshot_download as d; d('local-inference-lab/Qwen3.8-Flash-Next-NVFP4', revision='7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd', allow_patterns=['model-00035-of-00036.safetensors', 'model.safetensors.index.json'])" || exit 1
  vllm serve ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE \
    --revision 03f4a0570496bbe741189f4a2a7d611679e85406 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --default-chat-template-kwargs '{{"reasoning_effort":"medium"}}' \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
