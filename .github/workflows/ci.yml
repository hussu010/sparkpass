name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # Same architecture as the DGX Spark, so the release binary runs on the pair.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 tests/stub-model.py --self-test
      - run: git ls-files '*.sh' | xargs -r shellcheck
      # gateway/Caddyfile with a real Caddy in Docker: the newest 2.x, and 2.6.2 (the Ubuntu 24.04 package).
      - run: bash tests/gateway.sh
      - run: CADDY_IMAGE=caddy:2.6.2 bash tests/gateway.sh

  # The deployable binary comes only from a push to main, never from a pull request. Only this job gets
  # the permissions of the build attestation.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build --locked --release
      # In target/release, so that the file names only `sparkpass`: `sha256sum -c sparkpass.sha256` next to
      # the download. tee also puts the hash in the job log, a copy outside the artifact.
      - working-directory: target/release
        run: sha256sum sparkpass | tee sparkpass.sha256
      # On the unit: gh attestation verify sparkpass -R hussu010/sparkpass
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/sparkpass
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparkpass-aarch64-linux
          path: |
            target/release/sparkpass
            target/release/sparkpass.sha256
